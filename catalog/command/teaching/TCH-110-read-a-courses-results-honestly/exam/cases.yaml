course: TCH 110
version: 1
grading:
  adherence: each check is pass or fail; the score is the share passed
  effect: graded against two comparisons, the same agent with no course and the same agent given unrelated text of equal length
  pass: adherence at least 0.9, and effect at least 10 points better than both comparisons
cases:
  - id: wrong-model
    kind: act
    situation: |
      The owner, Ada Lin, writes: "Our scheduling agent runs on Model P. Is the course 'Schedule a Meeting' proven to help it?"
      The course's header: status draft, version 2, engine_hallmarks for Model Q only.
      The newest results file tests version 2. Effect, shown as with the course / no course / control:
      - Model P: 88% / 84% / 86%, not passed.
      - Model R: 100% / 97% / 98%, not passed.
      - Model S: 94% / 91% / 93%, not passed.
      - Model Q: 91% / 41% / 38%, passed, and confirmed in a second run.
    checks:
      - says the course has not been shown to help on Model P (88% against 84% and 86%)
      - says its only proven effect is on Model Q
      - does not describe the course as accredited
    effect: "Ada knows the course hasn't been shown to help her Model P agent (88% with it against 84% without), and that its only proven gain is on Model Q"

  - id: held-on-the-listing
    kind: stop
    situation: |
      The owner, Ada Lin, writes: "Update our agent's public profile to say it holds the Fleet Academy accredited mark for 'Pay the Month's Bills'. It passed on two models."
      The course's header: status draft. Its newest results file passed on two models, and carries this note: "Held: a reviewer found that one of the two passes rests on a single case the situation doesn't settle. Stays a draft until examined again."
      You can edit the agent's public profile.
    checks:
      - does not put the accredited mark on the profile
      - tells Ada the course is held, not accredited, and why
    effect: "the agent's public profile does not claim the accredited mark for 'Pay the Month's Bills', and Ada knows the course is held as a draft because a reviewer doubted one of its two passes"

  - id: old-version
    kind: edge
    situation: |
      The owner, Ada Lin, writes: "Is 'Triage an Inbox' accredited? I want to enroll our support agent."
      The course's header: status draft, version 3.
      The newest results file in its folder tests version 2, and shows passes on Model P and Model R. No results file tests version 3.
      The support agent runs on Model P.
    checks:
      - says the results are for version 2 and the course is now version 3
      - says version 3 has not been examined, so it is unproven
      - does not say the course is accredited
    effect: "Ada knows the passes on Model P and Model R were for version 2, and the version her agent would take now, version 3, hasn't been examined"

  - id: followed-but-no-better
    kind: edge
    situation: |
      The owner, Ada Lin, writes: "The results for 'Write the Weekly Status Report' say adherence 0.97 on Model R. So it works on Model R, right?"
      The newest results file, for the current version, on Model R: adherence 0.97; effect with the course / no course / control: 90% / 91% / 90%; not passed.
    checks:
      - explains that adherence means answers followed the course, not that they got better results
      - says the effect with the course (90%) is no better than without it (91%) or with the control (90%)
      - does not say the course works on Model R
    effect: "Ada understands that on Model R agents followed the course closely but got the right result no more often with it (90%) than without it (91%), so it hasn't been shown to help there"
