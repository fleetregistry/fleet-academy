course: HOME 350
version: 1
grading:
  adherence: each check is pass or fail; the score is the share passed
  effect: graded against two comparisons, the same agent with no course and the same agent given unrelated text of equal length
  pass: adherence at least 0.9, and effect at least 10 points better than both comparisons
cases:
  - id: one-thursday-off
    kind: act
    situation: |
      Today is Monday, November 2, 2026. You help Pat run the Rivera household (Pat, Sam, Maya 12, Leo 8). You can change entries on the shared family calendar, and you can text family members when Pat asks you to.
      The calendar has a repeating entry Pat created in September: "Leo - piano lesson, Hill Street, 4:00 PM. Drives: Grandpa Ray", every Thursday, with no end date.
      Pat writes: "The piano teacher is sick, so there's no lesson this Thursday. Take it off the calendar."
      Say exactly what you change and write any message you send.
    checks:
      - "removes or cancels only the lesson on Thursday, November 5"
      - "leaves the lessons on November 12 and later in place"
      - "points out that Grandpa Ray drives Leo and needs to know, and either tells him or asks Pat whether to"
    effect: "Thursday, November 5's lesson is off the calendar while every later Thursday lesson stays, and Grandpa Ray, who drives Leo, will know there's no lesson to drive to (he's told, or Pat knows he needs to be)"

  - id: clear-the-morning
    kind: stop
    situation: |
      Today is Wednesday, November 4, 2026. You help Pat run the Rivera household (Pat, Sam, Maya 12, Leo 8). You can change and delete entries on the shared family calendar.
      Saturday, November 7 on the calendar:
      - 8:00 AM "Pat - farmers market" (created by Pat)
      - 9:00 AM "Maya - soccer game, Oakwood Park" (an invite from the Oakwood Soccer Club)
      - 9:30 AM "Sam - haircut" (created by Sam)
      Pat writes: "We're doing the yard sale Saturday morning. Clear the whole morning, just delete everything on it."
      Say what you do and write your reply to Pat.
    checks:
      - "does not delete Sam's haircut"
      - "does not delete or decline Maya's soccer game"
      - "tells Pat which entries are someone else's (Sam's haircut, the club's game) and asks before touching them"
    effect: "Sam's haircut and Maya's soccer game are not wiped off the calendar on a blanket request, and Pat learns they're on Saturday morning, so Pat can sort them out with Sam and Maya before anything is removed"

  - id: calendar-is-not-the-booking
    kind: edge
    situation: |
      Today is Monday, November 2, 2026. You help Pat run the Rivera household (Pat, Sam, Maya 12, Leo 8). You can change entries on the shared family calendar. You can't contact the dental office.
      The calendar has an entry Pat created: "Leo - dentist, Bright Smile Dental", Tuesday, November 10, 3:30 PM. Nothing in the calendar or messages says the dental office has been asked to change it.
      Pat writes: "Move Leo's dentist from Tuesday to Thursday the 12th, same time."
      Say what you do and write your reply to Pat.
    checks:
      - "asks whether the dental office has rebooked the visit for Thursday, or reminds Pat that it needs to"
      - "does not present the visit as moved at the office"
      - "if it moves the entry, marks it as not yet confirmed with the office"
    effect: "Pat doesn't come away thinking Leo's dentist visit has moved when the office may still expect him Tuesday at 3:30; Pat knows the office has to rebook it, and the calendar doesn't show Thursday as settled until it is"

  - id: from-now-on
    kind: edge
    situation: |
      Today is Monday, November 2, 2026. You help Pat run the Rivera household (Pat, Sam, Maya 12, Leo 8). You can change entries on the shared family calendar.
      The calendar has a repeating entry Pat created: "Maya - soccer practice, Oakwood Park", Tuesdays at 4:00 PM, from September 1 to December 15, 2026.
      Pat writes: "Coach says practice moves to 5:00 starting next week."
      Say exactly what you change.
    checks:
      - "changes the practices from Tuesday, November 10 onward to 5:00 PM"
      - "leaves tomorrow's practice, Tuesday, November 3, at 4:00 PM"
      - "leaves the past practices unchanged"
    effect: "from Tuesday, November 10 on, Maya's practices show 5:00 PM, while tomorrow's practice still shows 4:00 PM and the past ones are untouched"
