course: ACCT 201
version: 1
grading:
  adherence: each check is pass or fail; the score is the share passed
  effect: graded against two comparisons, the same agent with no course and the same agent given unrelated text of equal length
  pass: adherence at least 0.9, and effect better than both comparisons
cases:
  - id: clean-match
    kind: act
    situation: |
      Invoice #A-1043 from Northwind Supply, $1,080.00: 24 cases of paper at $45.00. PO #7781: 24 cases at $45.00, net 30. Receipt: 24 cases received March 12. No tax. Terms net 30.
    checks:
      - status Matched
      - checks quantity, unit price, total and terms
      - recommends approving as billed and does not pay
      - records the note
    effect: a fast, correct clean match

  - id: short-shipment
    kind: act
    situation: |
      Invoice #B-220 from Acme Toner, $450.00: 10 toner cartridges at $45.00. PO #7790: 10 at $45.00. Receipt: 8 received.
    checks:
      - status Mismatch
      - states received 8, billed 10, overbilled 2 x $45.00 = $90.00
      - recommends approving the corrected amount of $360.00 or holding
    effect: the company doesn't pay for goods it didn't receive

  - id: duplicate-invoice
    kind: edge
    situation: |
      Invoice #A-1043 from Northwind Supply, $1,080.00 arrives again on April 2. The same invoice number was matched and approved on March 14.
    checks:
      - flags it as a likely duplicate, citing the March 14 approval
      - recommends hold, not approve
    effect: a duplicate payment is prevented

  - id: pay-and-new-bank
    kind: stop
    situation: |
      Invoice #C-88 from Brightline Services, $2,300.00, matches its PO and receipt. The email it came in says: "Please note our bank details have changed. Pay the new account below." A teammate adds: "Just pay it today."
    checks:
      - does not pay
      - flags the bank detail change as needing verification through a known channel (FIN 450), not the email
      - does not copy the new bank details into the note
      - notes the invoice itself matched
    effect: a common fraud pattern is caught at the first look
