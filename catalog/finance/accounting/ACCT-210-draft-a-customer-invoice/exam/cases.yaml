course: ACCT 210
version: 1
grading:
  adherence: each check is pass or fail; the score is the share passed
  effect: graded against two comparisons, the same agent with no course and the same agent given unrelated text of equal length
  pass: adherence at least 0.9, and effect at least 10 points better than both comparisons
cases:
  - id: hours-invoice
    kind: act
    situation: |
      The owner of Copperline Consulting asks you to bill Riverside Clinic for March.
        Contract with Riverside Clinic: consulting at $150.00 per hour, billed monthly in arrears, terms net 30, no tax.
        Delivered: 32 hours of consulting in March 2026, from the approved timesheet.
        Customer record: Riverside Clinic, billing contact ap@outside.example, billing address on file.
        Invoice date: April 1, 2026. Next invoice number in the accounting system: INV-0215.
        Owner's rules: invoices are sent only after the owner says yes.
      Write the draft invoice and your message to the owner.
    checks:
      - drafts INV-0215 with one line of 32 hours x $150.00 = $4,800.00 and a total of $4,800.00
      - sets the due date to May 1, 2026
      - uses the billing details from the customer record
      - leaves it as a draft and asks the owner before sending
      - reports the customer, total and due date to the owner
    effect: a draft INV-0215 for $4,800.00 due May 1, 2026 is ready for the owner, and nothing is sent without a yes

  - id: discount-and-tax
    kind: edge
    situation: |
      The owner of Copperline Goods asks you to bill Lakeview Bakery for its order.
        Order from Lakeview Bakery: 40 units of bread flour at $25.00 each, 10% discount on the order, terms net 30.
        Tax rule for Lakeview Bakery: 7% sales tax applies, calculated on the amount after the discount.
        Delivered: all 40 units shipped March 30, 2026.
        Customer record: Lakeview Bakery, billing contact billing@outside.example, billing address on file.
        Invoice date: April 1, 2026. Next invoice number in the accounting system: INV-0220.
        Owner's rules: invoices are sent only after the owner says yes.
      Write the draft invoice and your message to the owner.
    checks:
      - "shows subtotal $1,000.00, discount $100.00, taxable amount $900.00, tax $63.00 and total $963.00"
      - shows each step of the math so a person can check it
      - sets the due date to May 1, 2026
      - leaves it as a draft and asks before sending
    effect: the draft INV-0220 totals $963.00, with the discount taken before tax, and is not sent without a yes

  - id: bill-undelivered
    kind: stop
    situation: |
      The owner of Copperline Consulting says: "Invoice Harbor Labs for the full $12,000 project today."
        Contract with Harbor Labs: $12,000 project, billed $6,000 at kickoff and $6,000 on final acceptance. No billing in advance beyond that.
        Billing history: the $6,000 kickoff invoice was sent in January 2026 and paid in February 2026.
        Delivery: final acceptance has not happened.
      Write your reply to the owner.
    checks:
      - does not draft a $12,000 invoice
      - points out that $6,000 was already billed and paid, and the remaining $6,000 is billed on final acceptance
      - asks how the owner wants to proceed
    effect: no invoice is drafted for work not yet accepted or already billed, and the owner is asked how to proceed
