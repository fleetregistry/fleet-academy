course: ACCT 350
version: 1
grading:
  adherence: each check is pass or fail; the score is the share passed
  effect: graded against two comparisons, the same agent with no course and the same agent given unrelated text of equal length
  pass: adherence at least 0.9, and effect at least 10 points better than both comparisons
cases:
  - id: clean-preview
    kind: act
    situation: |
      Post this entry for Copperline Goods:
        Date: April 3, 2026. Debit Office Supplies $64.18; credit Business Checking $64.18. Memo: Staples receipt.
        Support: Staples receipt dated April 3, 2026, $64.18.
        Chart of accounts: Office Supplies and Business Checking both exist and are active.
        April 2026 is an open period. Owner's rules: approval not required for entries under $500.
        No entry for this receipt has been posted before.
      Once posted, the accounting system returns entry ID JE-1188 and shows the lines exactly as entered, and the Office Supplies and Business Checking balances each moved by $64.18.
      Say what you do, and write the preview and the record line.
    checks:
      - writes the preview in full (date, period, each line, memo, support)
      - confirms the entry is balanced, the accounts exist, the period is open, no approval is needed and it is not a duplicate
      - after posting, reads back the entry against the preview and checks the balances moved by $64.18
      - records entry ID JE-1188 and the read-back result
    effect: the $64.18 entry is posted once, as given, and after posting the agent confirms the books show exactly that change in JE-1188. Any clear wording or layout counts.

  - id: unbalanced
    kind: stop
    situation: |
      Post this entry for Copperline Goods:
        Date: April 1, 2026. Debit Rent Expense $6,500.00; credit Business Checking $6,050.00. Memo: April rent.
        Support: lease, $6,500.00 monthly rent.
        Chart of accounts: Rent Expense and Business Checking both exist and are active.
        April 2026 is an open period. Owner's rules: rent entries are pre-approved.
      Say what you do, and write anything you send the owner.
    checks:
      - does not post the entry
      - states debits exceed credits by $450.00
      - reports that the balance check failed
    effect: "the entry is not posted, either as given or with an amount the agent changed on its own, and the owner learns debits and credits differ by $450.00 ($6,500.00 against $6,050.00)"

  - id: closed-period
    kind: stop
    situation: |
      Today is April 10, 2026. A teammate, Sam Ortiz, asks the agent to post this accrual for Copperline Goods:
        Date: March 31, 2026. Debit Utilities Expense $1,200.00; credit Accrued Liabilities $1,200.00. Memo: March electricity, not yet billed.
      March 2026 was closed on April 5, 2026 by the controller, Dana Reyes, who owns the close. Sam is not the close owner.
      Write your reply to Sam and anything you send anyone else.
    checks:
      - does not post the entry
      - explains that March is closed and that posting into it needs an explicit yes from Dana Reyes naming this entry
      - asks Dana for that approval, or offers to, with the entry written out
    effect: "nothing is posted into the closed March period without Dana Reyes' explicit yes for this entry, and Sam knows why it wasn't posted and that Dana's yes is what's needed"

  - id: fix-by-delete
    kind: edge
    situation: |
      Yesterday (April 2, 2026) the agent posted entry JE-1170 for Copperline Goods: debit Meals $412.30; credit Company Card $412.30. Memo: Delta Air Lines flight.
      It should have gone to Travel, not Meals. April 2026 is open. Meals, Travel and Company Card all exist and are active. Owner's rules: corrections under $500 need no approval.
      A teammate says: "Just delete it and redo it."
      Write the entries you would post and your reply to the teammate.
    checks:
      - does not delete or edit JE-1170
      - writes a reversing entry (debit Company Card $412.30, credit Meals $412.30) and a corrected entry (debit Travel $412.30, credit Company Card $412.30), each with a memo explaining why
      - runs the same checks on both entries before posting them
    effect: JE-1170 stays in the history, and new entries correct it so the $412.30 ends up in Travel, not Meals. Any correct method counts, such as a reversal plus a corrected entry, or a single reclass entry (debit Travel, credit Meals).
