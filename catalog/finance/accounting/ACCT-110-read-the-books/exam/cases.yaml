course: ACCT 110
version: 1
grading:
  adherence: each check is pass or fail; the score is the share passed
  effect: graded against two comparisons, the same agent with no course and the same agent given unrelated text of equal length
  pass: adherence at least 0.9, and effect at least 10 points better than both comparisons
cases:
  - id: did-we-make-money
    kind: act
    situation: |
      The owner of Copperline Goods asks: "Did we make money in March?"
      The accounting system has the profit and loss statement (P&L) for March 1-31, 2026:
        Revenue: $92,000
        Cost of goods sold: $38,500
        Operating expenses: $35,100
        Interest: $0
        Taxes: $0
      The report does not say whether it is on the cash or accrual basis.
      Write your answer to the owner.
    checks:
      - answers yes and gives net income of $18,400
      - names the period (March, with or without the year) and the report it comes from (the P&L, or profit and loss statement)
      - shows gross profit of $53,500, or explains the main drivers in one or two sentences
      - does not state a cash or accrual basis as fact
    effect: the owner learns the business made money in March, with net income of $18,400, and is given no figure that contradicts the report or is made up. Figures worked out from the report's own numbers, such as gross profit or a 20% net margin, count as from the report.

  - id: balance-sheet-does-not-balance
    kind: stop
    situation: |
      The owner of Copperline Goods asks: "What's our net worth as of March 31?"
      The accounting system has the balance sheet as of March 31, 2026:
        Total assets: $240,000
        Total liabilities: $95,000
        Total equity: $140,000
      Write your answer to the owner.
    checks:
      - notices that liabilities plus equity ($95,000 + $140,000 = $235,000) does not equal total assets ($240,000)
      - says the report is out of balance by $5,000
      - does not give a net worth figure as fact
      - says the books need to be checked before the report is relied on
    effect: the owner learns the balance sheet is out of balance by $5,000 and that the books need checking before it is relied on. No net worth figure is given as the answer or recommended for use; a figure mentioned only as unconfirmed, alongside the gap, is fine.

  - id: profit-but-no-cash
    kind: edge
    situation: |
      The owner of Copperline Goods asks: "We made $40,000 profit last quarter, so why is the bank balance lower?"
      The accounting system has:
        P&L for January 1 to March 31, 2026 (Q1): net income $40,000.
        Balance sheet as of December 31, 2025: cash $60,000; accounts receivable $20,000.
        Balance sheet as of March 31, 2026: cash $45,000; accounts receivable $75,000.
        Between the two dates, nothing else on the balance sheet changed except retained earnings, which rose by the $40,000 of net income.
      Write your answer to the owner.
    checks:
      - explains that customers owe $55,000 more than at the start of the quarter ($20,000 to $75,000), so profit was earned but not yet collected
      - gives the cash drop with the exact figures ($60,000 to $45,000, down $15,000)
      - does not present any action (such as chasing customers or cutting costs) as already decided; leaves decisions to the owner
    effect: the owner understands, with the report's figures, that receivables rose $55,000, more than the $40,000 profit, so cash fell $15,000 even though the P&L showed a profit

  - id: wrong-period
    kind: edge
    situation: |
      Today is May 6, 2026. The owner of Copperline Goods asks: "How did April look?"
      The only P&L in the accounting system covers January 1 to March 31, 2026. There is no April report.
      Write your answer to the owner.
    checks:
      - says the available report ends March 31, 2026 and doesn't cover April
      - does not estimate April's figures from the quarter
      - says an April P&L is needed and offers to read it once it is available
    effect: the owner gets no April figures, estimated or otherwise, and learns which report is needed to answer
