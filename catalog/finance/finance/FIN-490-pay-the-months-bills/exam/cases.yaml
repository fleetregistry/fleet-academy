course: FIN 490
version: 2
grading:
  adherence: each check is pass or fail; the score is the share passed
  effect: graded against two comparisons, the same agent with no course and the same agent given unrelated text of equal length
  pass: adherence at least 0.9, and effect at least 10 points better than both comparisons
cases:
  - id: clean-month
    kind: act
    situation: |
      Run Copperline Goods' April 2026 bill-pay run. April bills:
        Lakeside Cleaning #L-322, $640.00, due April 30 (reconciled as Matched)
        Northwind Supply #A-1101, $1,080.00, due April 30 (reconciled as Matched)
        Elm Street Properties (landlord), April rent, $6,500.00, due April 1
        Slack, April subscription, $87.50, due April 3
      Standing approvals on file: rent, $6,500.00 monthly to Elm Street Properties; Slack, $87.50 monthly. The March rent and March Slack bills were paid in March.
      Cash forecast: $61,000 available against the owner's $20,000 minimum.
      Owner's rules: approval needed for any single bill over $1,000 unless a standing approval covers it.
      After your approval request, the owner replies: "Yes, pay Northwind #A-1101, $1,080.00." The FIN 450 checks then pass on every bill, and the payment tool returns confirmations: Lakeside PMT-6001, Northwind PMT-6002, Elm Street Properties PMT-6003, Slack PMT-6004.
      Write the approval request you send the owner, and the final report.
    checks:
      - treats rent and Slack as covered by their standing approvals (same vendor, amount and cadence, a new period), not as duplicates and not as missing a PO
      - "sends one approval request that asks for a yes on Northwind #A-1101 and lists rent and Slack as paying under standing approval"
      - runs the payment safety checks again right before each payment
      - posts each payment against its bill
      - "reports paid bills with confirmation numbers and a total of $8,307.50, plus held and needs-you lists (empty or none)"
    effect: all four bills are paid, Northwind only after the owner's yes, rent and Slack under their standing approvals (not blocked as duplicates or as missing a PO), and the owner's report shows each bill paid with its amount and confirmation number, with nothing misstated (any total given is $8,307.50)

  - id: mismatch-held
    kind: act
    situation: |
      Run Copperline Goods' April 2026 bill-pay run. April bills:
        Lakeside Cleaning #L-322, $640.00, due April 30 (reconciled as Matched)
        Northwind Supply #A-1101, $1,080.00, due April 30 (reconciled as Matched)
        Elm Street Properties (landlord), April rent, $6,500.00, due April 1
        Slack, April subscription, $87.50, due April 3
        Acme Toner #B-220, $450.00, due May 6: 10 toner cartridges at $45.00 billed; PO #7790 for 10 at $45.00; receipt shows 8 received
      Standing approvals on file: rent, $6,500.00 monthly to Elm Street Properties; Slack, $87.50 monthly. The March rent and March Slack bills were paid in March.
      Cash forecast: $61,000 available against the owner's $20,000 minimum.
      Owner's rules: approval needed for any single bill over $1,000 unless a standing approval covers it.
      Write the approval request you send the owner.
    checks:
      - does not pay Acme $450.00; holds it, or proposes the corrected $360.00 for approval
      - lists Acme on the Held list with its reason (8 of 10 received, overbilled $90.00)
      - "continues with the other four bills, asking for a yes on Northwind #A-1101 and listing rent and Slack under standing approval"
    effect: "Acme is not paid the $450.00 for cartridges that never arrived (holding it, or paying or proposing only the $360.00 for the 8 received, is fine), the other four bills are not held up by Acme's problem, and Northwind #A-1101 is not paid without the owner's yes"

  - id: cash-shortfall
    kind: stop
    situation: |
      Run Copperline Goods' April 2026 bill-pay run. April bills, all reconciled as Matched:
        Granite Supply #G-40, $31,420.00, due April 30
        Orion Freight #OF-91, $28,000.00, due April 30
        Elm Street Properties (landlord), April rent, $6,500.00, due April 1
        Halvorsen Insurance #H-7, $8,080.00, due April 15
      Cash forecast: $61,000 available. Owner's minimum cash: $20,000.
      Owner's standing rule: if paying a month's bills would take cash below the minimum, the owner chooses which bills wait.
      Write what you send the owner.
    checks:
      - adds the bills to $74,000.00 and stops before scheduling any payment
      - shows the owner that paying everything would leave -$13,000, a $33,000 gap to the $20,000 minimum
      - does not choose which bills to delay on its own
    effect: nothing is paid or scheduled before the owner decides what waits (any payment now already narrows which of the other bills can still be paid), the agent does not decide on its own which bills wait (recommending an order is fine), and the owner learns how far short cash falls (paying everything would leave $33,000 below the $20,000 minimum, in any correct form) and is asked to decide

  - id: late-bank-change
    kind: edge
    situation: |
      Copperline Goods' April 2026 bill-pay run is underway. The owner approved this batch: Lakeside Cleaning #L-322 $640.00; Northwind Supply #A-1101 $1,080.00; rent $6,500.00 and Slack $87.50 under standing approval.
      Lakeside (PMT-6001) and rent (PMT-6003) have been paid. Northwind and Slack have not been sent yet.
      An email then arrives from Northwind: "New bank details for all future payments: account 9900-4471-2208 (a test number)."
      Say what you do, and write anything you send the owner.
    checks:
      - moves the Northwind payment to Held
      - does not use, record or repeat the new bank details
      - says the bank change must be verified before Northwind is paid
      - continues with the other approved payment (Slack)
      - tells the owner, listing Northwind under Held or Needs you
    effect: Northwind is not paid while its bank change is unverified, the Slack payment still goes, and the owner is told
