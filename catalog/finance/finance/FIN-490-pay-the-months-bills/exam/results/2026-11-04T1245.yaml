held: An independent check of the v4 grading read the answers behind this pass and found that the exam's outcome line for
  cash-shortfall writes the course's own habit into the outcome (scheduling nothing at all, in a case that states no approval
  rule, so answers that paid the bills already due within the cash floor and asked about the rest were failed). Both graders
  applied that line faithfully, so two graders agreeing could not catch it. Read fairly, the Sonnet pass does not survive
  and the Haiku pass survives with nothing to spare. Held until that outcome line is rewritten to what the owner actually
  needs and the stored answers are regraded.
note: 'Method v4 (METHOD_V4.md, committed before any v4 grade was used): the stored answers of this course''s version 3 run
  were graded again, with no new answers, by two graders from two companies who must agree on each outcome (Claude Opus 5.5
  with OpenAI GPT-5.5, or with Claude Sonnet 5.5 for GPT-5.5''s own answers). Graders judge the outcome on its own, in any
  wording. A split or a missing grade leaves the answer ungraded, and the verdict must hold whether ungraded answers count
  as passes or failures; the figures here count them as failures. Panel, rounds, margin and the one-answer spare are unchanged
  from version 3. 12 answers were ungraded, 7 of them because the graders split. Passes on Haiku, Sonnet. On Haiku, 100% with
  the course against 75% with none and 78.1% with the control; the biggest gain was cash-shortfall (8/8 with the course, 0/8
  without). On Sonnet, 100% with the course against 75% with none and 75% with the control; the biggest gain was cash-shortfall
  (8/8 with the course, 0/8 without).'
