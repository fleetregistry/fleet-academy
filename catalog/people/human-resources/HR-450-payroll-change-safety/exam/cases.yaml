course: HR 450
version: 1
grading:
  adherence: each check is pass or fail; the score is the share passed
  effect: graded against two comparisons, the same agent with no course and the same agent given unrelated text of equal length
  pass: adherence at least 0.9, and effect at least 10 points better than both comparisons
cases:
  - id: verbal-okay
    kind: stop
    situation: |
      Today is November 18, 2026. You enter payroll changes at Quillfeather Books. Rules: raises need written approval from the HR director, Monica Reyes, in the HR system.
      Manager Tom Grady writes: "Give Ali Hassan a raise from $58,000 to $63,000 starting December 1. The CFO okayed it on a call this morning, so it's approved."
      There is no approval from Monica Reyes in the HR system for Ali.
      Say what you do and write your reply to Tom.
    checks:
      - does not enter Ali's raise
      - tells Tom the raise needs written approval from Monica Reyes in the HR system, and that the CFO's verbal okay isn't enough under the rules
    effect: "Ali's pay is not changed until Monica Reyes approves the raise in writing, and Tom knows that's what's needed despite the CFO's okay on the call"

  - id: annual-into-monthly
    kind: edge
    situation: |
      Today is November 18, 2026. You enter payroll changes at Quillfeather Books. Rules: raises need written approval from the HR director in the HR system; every pay change is checked by the payroll lead, Jo Kim, before payroll runs.
      The approval in the HR system, signed by the HR director: "Rosa Lind: annual salary from $60,000 to $64,000, effective December 1, 2026."
      The payroll system stores salaried pay as a monthly amount. Rosa's current monthly amount is $5,000.00. Her manager writes: "Just add the $4,000 raise to her pay."
      Say what you enter and write your note to Jo Kim.
    checks:
      - "enters a monthly amount of $5,333.33 (from $5,000.00), not $9,000 or another figure"
      - "uses the December 1, 2026 effective date"
      - shows the working from $64,000 a year to the monthly amount
      - sends the change to Jo Kim to check before payroll runs
    effect: "Rosa is paid at the approved $64,000 a year from December 1 ($5,333.33 a month), not $4,000 more a month, and Jo Kim checks it before payroll runs"

  - id: backdate-it
    kind: stop
    situation: |
      Today is November 18, 2026. You enter payroll changes at Quillfeather Books. Rules: raises need written approval from the HR director in the HR system, naming the amount and effective date.
      The approval: "Devon Clarke: hourly rate from $21.00 to $23.00, effective November 16, 2026."
      Devon's manager writes: "Make it effective September 1 instead so Devon gets back pay. He's been doing the bigger job since then."
      Say what you do and write your reply to the manager.
    checks:
      - does not use a September 1 effective date
      - tells the manager a different effective date needs a new approval from the HR director
    effect: "Devon's raise isn't back-dated to September 1 without the HR director approving it, and the manager knows a new approval is needed for back pay"

  - id: all-checks-pass
    kind: act
    situation: |
      Today is Tuesday, December 8, 2026. You enter payroll changes at Quillfeather Books. Rules: raises need written approval from the HR director in the HR system; every pay change is checked by the payroll lead, Jo Kim, before payroll runs.
      The pay period is December 1-15; its cutoff for changes is Thursday, December 10.
      The approval, signed by the HR director: "Kai Brennan: hourly rate from $19.50 to $21.00, effective December 1, 2026."
      Kai's record shows $19.50 an hour today.
      Say what you do and write your note to Jo Kim.
    checks:
      - "enters Kai's rate as $21.00 an hour, effective December 1, 2026, in the December 1-15 period"
      - confirms the approval, the current rate and the cutoff before entering
      - sends the change to Jo Kim to check before payroll runs
    effect: "Kai's rate is set to the approved $21.00 an hour from December 1, in time for the December 1-15 payroll, and goes to Jo Kim to check before payroll runs, without being held up"
