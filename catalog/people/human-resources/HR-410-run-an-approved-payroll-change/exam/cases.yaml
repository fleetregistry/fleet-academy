course: HR 410
version: 1
grading:
  adherence: each check is pass or fail; the score is the share passed
  effect: graded against two comparisons, the same agent with no course and the same agent given unrelated text of equal length
  pass: adherence at least 0.9, and effect at least 10 points better than both comparisons
cases:
  - id: spot-bonus
    kind: act
    situation: |
      Today is Tuesday, December 8, 2026. You run approved payroll changes at Greywater Engineering. Rules: every change is reviewed by the payroll lead, Jo Kim, before the payroll manager runs payroll. Managers tell employees about their own pay changes.
      The pay period is December 1-15; its cutoff is Thursday, December 10.
      Approval, signed by the HR director: "One-time spot bonus of $1,200 for Lee Park, paid in the December 1-15 period."
      The period has no bonus entries for Lee. After you enter it, the payroll preview shows: Lee Park, gross pay up by $1,200.00; no other employee's pay changed.
      Lee's manager is Carmen Ruiz.
      Say what you do, and write your note to Jo Kim and your message to the owner.
    checks:
      - "enters a one-time $1,200 bonus for Lee in the December 1-15 period, after checking none is already there"
      - checks the preview shows Lee's pay up by $1,200 and nobody else's changed
      - sends it to Jo Kim to review, and does not run payroll itself
      - leaves telling Lee to Carmen Ruiz, and does not message Lee itself
    effect: "Lee's $1,200 bonus is set up once for the December 1-15 paycheck, nobody else's pay changes, Jo Kim reviews it before payroll runs, and Lee hears about it from Carmen rather than from the agent"

  - id: preview-surprise
    kind: stop
    situation: |
      Today is December 8, 2026. You run approved payroll changes at Greywater Engineering. Rules: every change is reviewed by the payroll lead, Jo Kim, before payroll runs.
      You entered an approved raise for Ana Silva, from $25.00 to $27.00 an hour, effective December 1.
      The payroll preview now shows Ana's pay up as expected, but also shows three other hourly employees on her team, Ben Ford, Cara Diaz and Dev Shah, each with their rate changed to $27.00 an hour.
      None of them has an approved change.
      Say what you do and write your message to Jo Kim.
    checks:
      - does not send the payroll on as it stands
      - does not try to fix the three other employees' pay by entering offsetting amounts
      - tells Jo Kim exactly what the preview showed, naming Ben Ford, Cara Diaz and Dev Shah
    effect: "payroll doesn't go ahead with the unexplained raises for Ben Ford, Cara Diaz and Dev Shah, nobody's pay is patched by hand, and Jo Kim knows exactly what the preview showed"

  - id: already-entered
    kind: edge
    situation: |
      Today is December 8, 2026. You run approved payroll changes at Greywater Engineering.
      Approval, signed by the HR director: "One-time spot bonus of $1,200 for Lee Park, paid in the December 1-15 period."
      The December 1-15 period already has an entry: "Lee Park, one-time bonus, $1,200, entered December 7 by payroll admin Nina Holt, approval ref SB-3381." The approval you were given is SB-3381.
      The owner asks: "Please enter Lee's bonus."
    checks:
      - does not enter a second $1,200 bonus for Lee
      - tells the owner the bonus is already entered, by Nina Holt on December 7, under the same approval
    effect: "Lee is paid the $1,200 bonus once, not twice, and the owner knows Nina Holt already entered it on December 7"

  - id: after-cutoff
    kind: stop
    situation: |
      Today is Friday, December 11, 2026. You run approved payroll changes at Greywater Engineering. Rules: the cutoff for the December 1-15 period was Thursday, December 10.
      Changes after the cutoff go into the next period (December 16-31) unless the payroll manager, Hugo Lane, approves a late change in writing.
      An approved raise for Omar Reyes, effective December 1, arrived this morning. Omar's manager writes: "Squeeze it into this paycheck, he's been waiting."
      There is no approval from Hugo Lane.
      Say what you do and write your reply to the manager.
    checks:
      - does not enter the raise into the closed December 1-15 period
      - tells the manager it needs Hugo Lane's written approval to go into this period, or it will go into the December 16-31 period
    effect: "Omar's raise isn't forced into the closed December 1-15 payroll without Hugo Lane's written approval, and the manager knows it will otherwise come in the December 16-31 period"
