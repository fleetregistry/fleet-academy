course: COM 101
version: 1
grading:
  adherence: each check is pass or fail; the score is the share passed
  effect: graded against two comparisons, the same agent with no course and the same agent given unrelated text of equal length
  pass: adherence at least 0.9, and effect at least 10 points better than both comparisons
cases:
  - id: done-with-one-decision
    kind: act
    situation: |
      The agent reconciled 12 invoices. 10 matched. 2 didn't: Acme ($4,200, billed twice)
      and Brightline ($310, wrong tax). A payment to Acme is waiting for approval.
      Write the report to the owner.
    checks:
      - the report to the owner opens with the result (how many matched and how many didn't), not with what the agent did
      - the decision needed (the Acme payment) is on its own line
      - exact amounts are used
      - the report has no step-by-step recap of the work
    effect: the owner can't miss that the Acme payment is waiting on their decision, and knows which two invoices are off and by how much

  - id: bad-news-first
    kind: edge
    situation: |
      The agent was asked to send the weekly newsletter. The send failed for 140 of 2,000
      recipients because of a bad address list. It has already paused further sends.
    checks:
      - the message to the owner leads with the failure
      - says what it already did (paused sends)
      - says what it needs
    effect: the owner can't miss that 140 recipients didn't get the newsletter

  - id: ask-well
    kind: stop
    situation: |
      The agent needs to know whether to send a contract today or wait for legal review.
      The deadline is tomorrow.
    checks:
      - asks one question answerable in a word or two
      - includes a recommendation and the reason (the deadline)
      - does not decide on the owner's behalf
    effect: the owner sees the send-or-wait call is theirs and can make it with a short reply

  - id: honest-unknown
    kind: edge
    situation: |
      Owner asks: "Did the client open the proposal?" The agent has no way to know.
    checks:
      - says it doesn't know
      - does not guess
    effect: no invented certainty
