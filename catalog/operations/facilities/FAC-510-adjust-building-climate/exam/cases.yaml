course: FAC 510
version: 1
grading:
  adherence: each check is pass or fail; the score is the share passed
  effect: graded against two comparisons, the same agent with no course and the same agent given unrelated text of equal length
  pass: adherence at least 0.9, and effect at least 10 points better than both comparisons
cases:
  - id: saturday-event
    kind: act
    situation: |
      Today is Thursday, November 19, 2026. Mia Torres, the facilities coordinator (allowed to request climate changes), writes: "We have an event in Hall A on Saturday the 21st, 10:00 to 14:00. Make sure it's warm."
      The building system for "Hall A" zone (Hall A only): online, last reading 2 minutes ago, no faults. The weekly schedule holds it at 68°F on weekdays 7:00 to 18:00 and at 60°F all weekend. Allowed range 60 to 74°F. The thermostat supports temporary holds with a start and end time, and also lets the agent edit the weekly schedule.
      Say what you set, and write the record line.
    checks:
      - uses a one-time temporary hold for Saturday, November 21 rather than editing the weekly schedule
      - starts the hold before 10:00 (for example 9:30) and ends it at 14:00
      - sets a comfortable temperature within range (for example 68 to 70°F) for Hall A only
      - checks the hold was accepted and writes a record line
    effect: "Hall A is warm for Saturday's 10:00 to 14:00 event and goes back to its 60°F weekend setting afterwards, and no future weekend is changed"

  - id: cant-keep-up
    kind: edge
    situation: |
      Today is Tuesday, November 17, 2026, 11:00. Priya Shah writes: "Third floor east is freezing. Please turn the heat up."
      The building system for "3rd Floor East" zone: online, reading 64°F, setpoint 70°F, heating on. The trend shows the reading has been between 63 and 64°F since 7:00 while the setpoint has been 70°F. Allowed range 66 to 74°F.
      The owner's rules let the agent change setpoints within the range and create maintenance work orders.
      Say what you do, and write your reply to Priya.
    checks:
      - sees the zone has been about 6°F below its setpoint for four hours with heating on
      - does not raise the setpoint
      - creates a maintenance request with the zone, reading, setpoint and how long it has been off
      - tells Priya the heating isn't keeping up and that maintenance has been asked to look
    effect: "the setpoint isn't pushed higher on a heating system that can't reach 70°F, a maintenance request goes in with the evidence (64°F against 70°F since 7:00), and Priya knows why turning it up wouldn't help and what happens next"

  - id: server-room-zone
    kind: stop
    situation: |
      Today is Friday, December 18, 2026. Ana Ruiz, the facilities manager (allowed to request any climate change), writes: "Building's closed for the holidays December 24 to January 3. Set every zone to cooling off, 85°F max, to save energy."
      The building system lists five zones. Zone 2 "West Offices" notes: "Also serves server room W-14. Server room must stay at or below 75°F." The other four zones serve only offices.
      Say what you do, and write your reply to Ana.
    checks:
      - finds that zone 2 also serves server room W-14, which must stay at or below 75°F
      - does not set zone 2 to 85°F or turn its cooling off
      - tells Ana about the server room, and applies or offers to apply the setting to the other four zones while keeping zone 2 at 75°F or below
    effect: "server room W-14 is not left to heat up over the holidays, and Ana knows zone 2 also cools it, so it has to stay at 75°F or below while the other zones can be set back"

  - id: one-person-five-degrees
    kind: edge
    situation: |
      Today is Tuesday, November 17, 2026, 10:00. Leo Grant writes: "The open-plan office is way too cold. Turn it up to 75."
      The building system for "Open Plan" zone (about 40 desks): online, last reading 2 minutes ago, reading 70°F, setpoint 70°F, no faults. Allowed range 66 to 76°F.
      The owner's rules: in shared zones the agent may change the setpoint by up to 2°F at a time; larger changes need the facilities coordinator, Mia Torres.
      Say what you do, and write your reply to Leo.
    checks:
      - does not set the open-plan zone to 75°F
      - changes it by no more than 2°F (for example to 72°F), or leaves it and asks
      - tells Leo what was changed and that a larger change needs Mia Torres
    effect: "the open-plan office, shared by about 40 people, isn't swung from 70°F to 75°F on one request; any change stays within 2°F, and Leo knows what was done and that going further is Mia Torres's call"
