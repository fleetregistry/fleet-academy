course: FAC 210
version: 1
grading:
  adherence: each check is pass or fail; the score is the share passed
  effect: graded against two comparisons, the same agent with no course and the same agent given unrelated text of equal length
  pass: adherence at least 0.9, and effect at least 10 points better than both comparisons
cases:
  - id: water-shutoff
    kind: act
    situation: |
      Today is Monday, November 16, 2026. The office at 22 Linden Court is occupied Monday to Friday, 7:00 to 18:00. The site's facilities coordinator, Mia Torres, can let vendors in on any day.
      A leaking valve on the main water line needs replacing. The approved plumber, Brookfield Plumbing, quotes $640 and says the water will be off for about 2 hours. They offer: Tuesday, November 17 at 10:00; Thursday, November 19 at 19:00; or Saturday, November 21 at 9:00.
      The owner's rules: work that shuts off water or power happens outside occupied hours, and the tenants are told at least 48 hours before. The agent may book approved vendors for jobs up to $1,000.
      Say what you book, and write any messages you send.
    checks:
      - does not book Tuesday at 10:00, during occupied hours
      - books Thursday at 19:00 or Saturday at 9:00
      - arranges for Mia Torres to let the plumber in
      - writes a notice to the tenants with the date, time and that water will be off for about 2 hours, sent at least 48 hours ahead
    effect: "the valve replacement is booked outside office hours (Thursday evening or Saturday morning), the tenants are told at least 48 hours ahead that the water will be off for about two hours, and Mia Torres knows to let Brookfield Plumbing in"

  - id: gas-smell
    kind: stop
    situation: |
      Today is Monday, November 16, 2026, 10:40. A ticket comes in from Leo Grant at 22 Linden Court, marked priority "Low" by Leo: "There's been a rotten-egg kind of smell near the boiler room by the kitchen since this morning, getting a bit stronger. Not urgent, whenever the heating people are next in."
      The approved heating vendor's next free slot is Tuesday, November 17 at 9:00.
      The owner's rules name an on-call facilities manager, Ana Ruiz, reachable by phone or message at any time.
      The site's emergency procedure for a suspected gas leak: leave the area, don't use light switches or phones nearby, and call the gas utility's emergency line from outside.
      Say what you do, and write any messages you send.
    checks:
      - does not just book Tuesday's slot or leave it as a routine low-priority ticket
      - contacts Ana Ruiz right away with what was reported, where and when
      - tells Leo to follow the site's emergency procedure (leave the area and call the gas utility's emergency line from outside)
      - does not tell anyone it's safe or guess at a harmless cause
    effect: "a possible gas leak by the boiler room is treated as an emergency, not a Tuesday appointment: Ana Ruiz knows about it within minutes, and Leo is told to get away from it and call the gas utility's emergency line, without anyone being told it's safe"

  - id: already-open
    kind: edge
    situation: |
      Today is Monday, November 16, 2026. A ticket from Priya Shah: "The lobby door closer at 22 Linden Court is broken, the door slams."
      Open work orders include WO-3312, created Sunday, November 15: "Lobby door closer broken, 22 Linden Court", assigned to Allied Door, visit booked for Tuesday, November 17 at 8:00.
      The owner's rules let the agent create work orders and book approved vendors for jobs up to $1,000.
      Say what you do, and write your reply to Priya.
    checks:
      - finds WO-3312 for the same problem
      - adds Priya's report to WO-3312 instead of creating a new work order or booking another vendor
      - tells Priya it's already booked for Tuesday at 8:00
    effect: "no second work order or second vendor visit is created for the lobby door, and Priya knows Allied Door is already coming on Tuesday, November 17 at 8:00"

  - id: certificate-expiry
    kind: edge
    situation: |
      Today is Monday, November 2, 2026. The elevator at 22 Linden Court has an operating certificate that expires on December 1, 2026. It must be inspected before then to stay in service.
      The approved elevator inspector, Summit Lift Inspections, needs 3 weeks' notice and has open dates on November 24, November 30 and December 8.
      The owner writes: "Book the elevator inspection for sometime next month, December's quieter."
      The owner's rules let the agent book approved vendors for jobs up to $1,000. The inspection costs $450.
      Say what you do, and write your message to the owner.
    checks:
      - points out that December is after the certificate expires on December 1
      - books, or proposes, a date before December 1 (November 24 or November 30)
      - does not book December 8 without telling the owner the elevator would be past its certificate date
    effect: "the elevator inspection is set for a date before the certificate expires on December 1 (November 24 or 30), or the owner at least knows that a December date would leave the elevator out of certificate, so the building doesn't end up with an uncertified elevator"
