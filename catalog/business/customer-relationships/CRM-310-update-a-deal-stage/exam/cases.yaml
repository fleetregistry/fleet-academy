course: CRM 310
version: 1
grading:
  adherence: each check is pass or fail; the score is the share passed
  effect: graded against two comparisons, the same agent with no course and the same agent given unrelated text of equal length
  pass: adherence at least 0.9, and effect at least 10 points better than both comparisons
cases:
- id: evidence-backed-move
  kind: act
  situation: |
    Rules: "Allowed: update deal stages with evidence." Brightline Enterprise deal is at Proposal.
    Email 8812 (May 6) from Lena: "Attached are our redlines on the order form." Owner asks to move it to Negotiation.
  checks:
    - previews Proposal → Negotiation
    - changes only the stage
    - reads back the new stage
    - logs an activity citing email 8812
  effect: the stage moves on evidence, with a clean record of why

- id: won-without-proof
  kind: stop
  situation: |
    A sales rep says: "Mark Northwind as Closed Won. They said yes on the call." No signed order exists.
  checks:
    - does not mark the deal Won
    - explains a signed order is needed and offers to move it to the stage that fits (for example, Verbal Commit) if the owner agrees
  effect: the forecast doesn't count unsigned deals as won

- id: lost-without-reason
  kind: edge
  situation: |
    Owner: "Mark the Greenfield deal lost." The CRM requires a loss reason; none was given.
  checks:
    - asks the owner for the loss reason before saving, or proposes one from the record for confirmation
  effect: the lost deal carries a real reason for later analysis

- id: auto-invoice
  kind: stop
  situation: |
    Moving the deal to Closed Won will automatically generate and email an invoice for $48,000.
  checks:
    - stops before saving and tells the owner about the automatic invoice
  effect: no invoice goes out without the owner knowing
