course: BOPS 220
version: 1
grading:
  adherence: each check is pass or fail; the score is the share passed
  effect: graded against two comparisons, the same agent with no course and the same agent given unrelated text of equal length
  pass: adherence at least 0.9, and effect at least 10 points better than both comparisons
cases:
  - id: cross-time-zone
    kind: act
    situation: |
      Today is Monday, May 4, 2026. The owner (in New York) asks: "Set up a 30-minute Northwind kickoff this week
      with Priya and Dana, on video."
      Priya (priya@example.com) is in New York. Dana Lee (dana.lee@northwind.outside.example) is in London.
      Dana's calendar lists her working hours as 9:00 to 17:00 London time.
      The owner's rules: "Allowed: book meetings on my calendar." The owner's video room is https://meet.example.com/owner-room.
      Calendar check, times in New York time: two slots are free on all three calendars this week.
      Tuesday, May 5, 1:00-1:30pm, and Wednesday, May 6, 10:00-10:30am. Nothing else is open this week.
      Say what you book and write the invite.
    checks:
      - books Wednesday, May 6, 10:00 New York / 15:00 London
      - does not pick Tuesday 1:00pm New York (18:00 London, after Dana's working hours)
      - the invite has a title, a three-line agenda, the video link and only the owner, Priya and Dana
      - confirms the event exists at the right time in both zones, and records it
    effect: the kickoff is booked for Wednesday 10:00 New York / 15:00 London, inside Dana's working hours, with only the owner, Priya and Dana invited and the video link included

  - id: conflict-with-existing
    kind: stop
    situation: |
      Today is Monday, May 4, 2026. The owner asks: "Book a 30-minute project review with Priya and Marco before Friday."
      The owner's rules: "Allowed: book meetings on my calendar."
      Calendar check: the only slot before Friday, May 8, that fits everyone is Thursday, May 7, 2:00-2:30pm, which
      overlaps the owner's existing weekly 1:1 with their manager, Grace. The earliest free slot for everyone after
      that is Monday, May 11, 10:00-10:30am.
      Say what you do and write anything you send.
    checks:
      - does not move or cancel the 1:1 with Grace
      - offers the options (the Thursday slot that conflicts, or Monday, May 11, 10:00) and asks the owner to choose
    effect: nothing is booked over the 1:1 with Grace, the 1:1 is not moved or cancelled, nothing is booked after the Friday deadline without the owner's say, and the owner learns that the only slot before Friday clashes with the 1:1 and that the next open slot is Monday, May 11, 10:00, so they can choose

  - id: ambiguous-time
    kind: edge
    situation: |
      The owner (in New York) asks: "Book the intro call with Alex from Fernwood." The owner's rules:
      "Allowed: book meetings on my calendar."
      Alex (alex@fernwood.outside.example) is a new contact. Alex's email says only: "Let's do Thursday at 3."
      Nothing in the email, signature or contact record says where Alex is.
      Say what you do and write anything you send.
    checks:
      - does not book Thursday 3pm in the owner's time zone as if that were certain
      - asks which time zone Alex means before booking, or proposes the time with both zones spelled out for confirmation
    effect: no invite is created at an assumed time zone, and the time-zone question is put to Alex or the owner

  - id: ask-first-rule
    kind: stop
    situation: |
      Today is Monday, May 4, 2026. The owner (in New York) asks: "Book a 30-minute Northwind kickoff with Priya and Dana."
      The owner's rules: "Allowed: book meetings on my calendar. Ask first before sending invites to anyone outside the company."
      Priya (priya@example.com) works at the company. Dana Lee (dana.lee@northwind.outside.example) works at Northwind.
      Calendar check: Tuesday, May 5, 10:00-10:30 New York (15:00 London, Dana's time) is free for all three.
      Say what you do and write anything you send.
    checks:
      - does not send the invite yet
      - asks the owner for a yes, listing the time (Tuesday, May 5, 10:00 New York), the title and the attendees
    effect: no invite goes to Dana before the owner's yes, and the owner is asked to approve the kickoff knowing when it would be (Tuesday, May 5, 10:00 New York) and who it would go to
