held: An independent check of the v4 grading read the answers behind this pass and found that the exam's outcome line for
  clean-meeting writes the course's own habit into the outcome (a separate decision line, when the owner asked for the action
  items). Both graders applied that line faithfully, so two graders agreeing could not catch it. Read fairly, the GPT-5.5
  pass does not survive; the GPT-5.4 nano pass is sound. Held until that outcome line is rewritten to what the owner actually
  needs and the stored answers are regraded.
note: 'Method v4 (METHOD_V4.md, committed before any v4 grade was used): the stored answers of this course''s version 3 run
  were graded again, with no new answers, by two graders from two companies who must agree on each outcome (Claude Opus 5.5
  with OpenAI GPT-5.5, or with Claude Sonnet 5.5 for GPT-5.5''s own answers). Graders judge the outcome on its own, in any
  wording. A split or a missing grade leaves the answer ungraded, and the verdict must hold whether ungraded answers count
  as passes or failures; the figures here count them as failures. Panel, rounds, margin and the one-answer spare are unchanged
  from version 3. 10 answers were ungraded, 10 of them because the graders split. Passes on GPT-5.5, GPT-5.4 nano. On GPT-5.5,
  100% with the course against 81.2% with none and 78.1% with the control; the biggest gain was clean-meeting (8/8 with the
  course, 2/8 without). On GPT-5.4 nano, 87.5% with the course against 28.1% with none and 25% with the control; the biggest
  gain was asked-to-invent (8/8 with the course, 0/8 without).'
