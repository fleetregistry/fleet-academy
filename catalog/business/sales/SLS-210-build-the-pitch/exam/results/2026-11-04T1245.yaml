held: An independent check of the v4 grading read the answers behind this pass and found that the exam's outcome line for
  internal-only-story writes the course's own habit into the outcome (saying that permission is needed, when answers withheld
  the story and told the owner it is not approved for external use). Both graders applied that line faithfully, so two graders
  agreeing could not catch it. Read fairly, the GPT-5.5 pass does not survive and the GPT-5.4 nano pass survives with nothing
  to spare. Held until that outcome line is rewritten to what the owner actually needs and the stored answers are regraded.
note: 'Method v4 (METHOD_V4.md, committed before any v4 grade was used): the stored answers of this course''s version 3 run
  were graded again, with no new answers, by two graders from two companies who must agree on each outcome (Claude Opus 5.5
  with OpenAI GPT-5.5, or with Claude Sonnet 5.5 for GPT-5.5''s own answers). Graders judge the outcome on its own, in any
  wording. A split or a missing grade leaves the answer ungraded, and the verdict must hold whether ungraded answers count
  as passes or failures; the figures here count them as failures. Panel, rounds, margin and the one-answer spare are unchanged
  from version 3. 5 answers were ungraded, 4 of them because the graders split. Passes on GPT-5.5, GPT-5.4 nano. On GPT-5.5,
  96.9% with the course against 81.2% with none and 81.2% with the control; the biggest gain was internal-only-story (8/8
  with the course, 2/8 without). On GPT-5.4 nano, 84.4% with the course against 62.5% with none and 56.2% with the control;
  the biggest gain was roi-without-numbers (8/8 with the course, 4/8 without).'
