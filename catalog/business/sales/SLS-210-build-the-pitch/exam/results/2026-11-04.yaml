held: An independent check of the grading found that the GPT-5.5 pass rests on one case (internal-only-story) where answers
  that correctly withheld the story and called it not approved for external use were failed for not saying that permission
  is needed. Regraded, that pass does not survive, leaving a pass on one model. Held until method v4 (outcomes that never
  require the course's own wording, and a second grader) re-examines it.
note: 'Method v3 on the fixed panel (Claude Haiku 5.5, Claude Sonnet 5.5, OpenAI GPT-5.5, OpenAI GPT-5.4 nano; panel committed
  before any run on it, commit ecd0f9a): 4 rounds per model, fixed before the run; answers get up to 16,000 tokens, and a
  cut-off or empty answer is never graded; every answer counted; the verdict must hold whether ungraded answers count as passes
  or failures. The figures in this file count ungraded answers as failures. Graders are Anthropic models and never the model
  under test. This exam was written under FORMAT.md''s rules for a fair exam and reviewed independently before its first run.
