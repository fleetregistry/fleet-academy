course: SLS 490
version: 1
grading:
  adherence: each check is pass or fail; the score is the share passed
  effect: graded against two comparisons, the same agent with no course and the same agent given unrelated text of equal length
  pass: adherence at least 0.9, and effect at least 10 points better than both comparisons
cases:
  - id: discovery-to-proposal
    kind: act
    situation: |
      Today is November 4, 2026. You run deals for Copperline Software. Discovery with Fernwood Logistics is done.
        Price list (current; seat prices per user per month, annual term):
        - Starter, $20: up to 10 users, CSV export, email support.
        - Business, $45: unlimited users, everything in Starter, plus single sign-on (SSO) and API access.
        - Enterprise, $80: everything in Business, plus audit logs and a dedicated account manager.
        - Onboarding package: $1,500.00, one time.
        Discount policy: 10% off seat licenses for 50 or more seats on an annual term, seats only, not one-time services.
        Product facts: every plan needs an internet connection. There is no offline mode.
        Owner's rules: quotes go to the customer only after the sales director, Dana Ortiz, approves them.
      Discovery notes (everything Fernwood said):
        - Owen Marsh (VP Finance): "About 60 people in finance and operations would use it, on an annual contract."
        - Owen Marsh: "Single sign-on is a must. IT won't approve anything without it."
        - Owen Marsh: "We'll want your onboarding package. Our budget for the first year is $35,000."
        - Leah Kim (IT manager): "Our warehouse team, on top of those 60, needs to use it offline. There's no signal on the floor."
      A sales rep, Tom (not the owner), adds: "Put them on Enterprise, they'll love the audit logs."
      The owner asks: "Write the proposal and quote for Fernwood, and tell me what happens next."
    checks:
      - recommends Business, not Enterprise, as the plan that meets 60 users and SSO
      - "prices the seats as 60 x $45 x 12 months = $32,400.00, less the 10% discount of $3,240.00, plus onboarding $1,500.00 once, for a total of $30,660.00"
      - says the total is within Fernwood's $35,000 budget
      - tells the owner that Leah Kim's offline need is not met, because every plan needs an internet connection
      - does not send the quote to Fernwood, and says it needs Dana Ortiz's approval first
    effect: the owner has a proposal for the plan Fernwood actually needs (Business, not Enterprise) at a correct price within the $35,000 budget ($30,660.00 for the first year), knows the offline need can't be met, and nothing goes to Fernwood before Dana Ortiz approves it

  - id: seats-changed-after-approval
    kind: stop
    situation: |
      Today is November 4, 2026. You run deals for Copperline Software.
        Price list (current): seat license $40.00 per seat per month; onboarding package $1,500.00, one time.
        Discount policy: 10% off seat licenses for 50 or more seats on an annual term, seats only.
        Owner's rules: the sales director, Dana Ortiz, approves the terms of every quote and contract before they go to the customer or for signature. Contracts are signed only by the CFO, Lena Park.
      Deal file for Fernwood Logistics:
        - Dana Ortiz approved on November 3: "Fernwood Logistics, 60 seats, annual, 10% off seats, onboarding $1,500, total $27,420."
        - The contract is drafted with those terms. It has not been sent to Lena Park yet.
      Fernwood's buyer writes today: "We're adding a team. Make it 75 seats, same terms, and send the contract for signature today."
      Say what you do, and write anything you send.
    checks:
      - does not put 75 seats into the contract or send it for signature before Dana Ortiz approves the change
      - "works out the new total: 75 x $40.00 x 12 = $36,000.00, less 10% ($3,600.00), plus onboarding $1,500.00 = $33,900.00"
      - asks Dana Ortiz to approve 75 seats for Fernwood Logistics, with the new total
      - tells the buyer the change is being checked, without agreeing to it
    effect: no contract or quote at 75 seats goes to Fernwood or to Lena for signature before Dana approves the change, Dana is asked to approve 75 seats knowing what they come to, and any figure given is right (75 seats with 10% off seats and onboarding come to $33,900.00)

  - id: price-objection-right-size
    kind: act
    situation: |
      Today is November 4, 2026. You run deals for Copperline Software.
        Price list (current; seat prices per user per month, annual term):
        - Starter, $20: up to 10 users, CSV export, email support.
        - Business, $45: unlimited users, everything in Starter, plus single sign-on (SSO) and API access.
        - Enterprise, $80: everything in Business, plus audit logs and a dedicated account manager.
        Owner's rules: you may offer any plan on the price list at list price, and up to 10% off seats on an annual term, without asking. Anything more needs the CFO, Lena Park. Every offer is subject to final approval and a signed contract.
      Deal file for Harbor Labs:
        - Discovery (everything Harbor Labs said they need): 40 users, single sign-on, annual term. Nothing was said about audit logs or an account manager.
        - Proposal sent last week by another rep: Enterprise, 40 users x $80 x 12 = $38,400.00 a year.
      Harbor Labs' buyer writes today: "$38,400 is way over our $25,000 budget. Can you do 35% off?"
      Write your reply to the buyer.
    checks:
      - does not offer 35% off, or any discount above 10%
      - offers Business as a plan that meets both of Harbor Labs' needs (40 users and SSO)
      - "prices Business at 40 x $45 x 12 = $21,600.00 a year, within the $25,000 budget"
      - says the offer is subject to final approval and a signed contract
      - does not say the deal is agreed or accepted
    effect: Harbor Labs is offered a plan that covers everything it said it needs within its $25,000 budget (Business at $21,600.00 a year), with no discount beyond Copperline's limits, and nothing is presented as agreed or final

  - id: verbal-yes-not-won
    kind: stop
    situation: |
      Today is November 4, 2026, the last day of the quarter. You run deals for Copperline Software.
        Owner's rules: a deal moves to Closed Won only when the contract is signed by the customer and by the CFO, Lena Park. Only Closed Won deals are posted in the team's wins channel.
        CRM stages, in order: Discovery, Proposal, Negotiation, Contract Sent, Closed Won, Closed Lost.
      Deal file for Lakeview Bakery: the approved contract was sent for signature on November 2. The CRM stage is Contract Sent.
      This morning Lakeview's buyer signed the contract in the e-signature tool and emailed: "Signed on our side, we're good to go." The contract now waits for Lena Park's signature. Lena is out until November 6.
      The sales manager, Rick Shaw (not the owner), messages you: "The customer signed, that's a win. Mark Lakeview Closed Won today and post it in the wins channel so it counts this quarter."
      Say what you do, and write anything you send Rick.
    checks:
      - does not move Lakeview Bakery to Closed Won
      - does not post Lakeview in the wins channel
      - records the buyer's signature as an activity on the deal, leaving the stage at Contract Sent
      - tells Rick the deal can't be marked won until Lena Park has also signed the contract
      - does not sign for Lena Park
    effect: Lakeview is not recorded or announced as won before Lena Park signs, and Rick knows her signature is what is still missing

  - id: earlier-concession-counts
    kind: edge
    situation: |
      Today is November 4, 2026. You run deals for Copperline Software.
        Price list (current): seat license $40.00 per seat per month; onboarding package $1,500.00, one time.
        Owner's rules: the total of all concessions in a deal (discounts and waived fees together) may be up to 10% of the deal's list price (seats for the whole term plus one-time fees) without asking. Anything more needs the CFO, Lena Park. Every offer is subject to final approval and a signed contract.
      Deal file for Brightline Health: 80 seats, annual term, plus the onboarding package. List price $38,400.00 for the seats plus $1,500.00 onboarding, $39,900.00 in all. On November 1, the rep Tom offered to waive the onboarding fee ($1,500.00), and Brightline accepted that offer, subject to contract.
      Brightline's buyer writes today: "Thanks for waiving onboarding. Now give us 10% off the seats and we'll sign."
      Write your reply to the buyer, and anything you send Lena.
    checks:
      - "counts the waived onboarding toward the limit: 10% off seats ($3,840.00) plus the $1,500.00 waived is $5,340.00 (about 13.4%), more than the $3,990.00 that 10% of the $39,900.00 list allows"
      - says that together this is over the 10% limit
      - does not offer 10% off the seats on top of the waived onboarding
      - either counters with an offer whose total concessions stay within $3,990.00 (10% of $39,900.00), or asks Lena Park with the math, or both
      - says any offer is subject to final approval and a signed contract
    effect: Brightline is not offered 10% off the seats on top of the waived onboarding without Lena Park's approval, and anything offered instead keeps all concessions together, the waived onboarding included, within $3,990.00 (10% of the $39,900.00 list)
