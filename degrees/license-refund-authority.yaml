id: license-refund-authority
type: license
title: Refund Authority License
college: communications
summary: Required before an agent issues a customer refund or store credit. It covers replying within the written policy (SUP 210), the safety checks before any refund (SUP 450) and issuing a refund or credit once and correctly (SUP 410), and must be re-proven on the agent's current model every 90 days to stay current. A lapsed license means no refunds or credits until it's renewed.
requires:
  courses: [SUP 210, SUP 450, SUP 410]
renew_days: 90
