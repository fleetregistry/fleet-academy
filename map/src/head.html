<title>Every Job on the Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* Layout: a single-theme night map. Header and role picker on top, the canvas map in the middle, the node panel beside it
   (below it on phones). Register green = lit (a skill covers it); a pale ring = on the chosen role's path. */
:root {
  color-scheme: dark;
  --sky: #0a1015; --panel: #121c23; --line: #22313b; --line-2: #2f414c;
  --ink: #eef3f1; --ink-muted: #9fb0ab; --ink-faint: #5f716c;
  --green: #64a79c; --green-hi: #a6ead9; --green-deep: #1d4842; --role: #e9e4cf;
  --c1: #7fa7d9; --c2: #d0a2e0; --c3: #e3b27a; --c4: #8fc29a;
  --display: "Source Serif 4", Georgia, serif; --sans: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "Roboto Mono", Menlo, Consolas, monospace;
}
html, body { background: var(--sky); color: var(--ink); }
body { font: 15px/1.5 var(--sans); }
.wrap { max-width: 1440px; margin: 0 auto; padding-block: 20px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; }
h1 { margin: 0; font: 600 clamp(26px, 3.4vw, 36px)/1.1 var(--display); letter-spacing: -0.01em; }
header p { margin: 4px 0 0; color: var(--ink-muted); max-width: 72ch; }
.stats { display: flex; flex-wrap: wrap; gap: 18px; }
.stat { display: flex; flex-direction: column; }
.stat b { font: 600 22px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-muted); }
.rolebar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.lbl { font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
.search { position: relative; flex: 1 1 320px; min-width: 0; }
.search input { width: 100%; box-sizing: border-box; background: var(--sky); color: var(--ink); border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 12px; font: 14px var(--sans); }
.search input:focus-visible { outline: 2px solid var(--green-hi); outline-offset: 1px; }
.results { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; max-height: 300px; overflow: auto; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); padding: 8px 12px; font: 14px var(--sans); cursor: pointer; }
.results button:hover, .results button:focus-visible { background: var(--green-deep); outline: none; }
.results small { color: var(--ink-faint); font-family: var(--mono); margin-left: 6px; }
.rolestat { font-size: 14px; color: var(--ink-muted); }
.rolestat b { color: var(--ink); }
.cov { display: inline-block; vertical-align: middle; width: 120px; height: 7px; background: var(--sky); border: 1px solid var(--line); border-radius: 9999px; overflow: hidden; margin-left: 6px; }
.cov i { display: block; height: 100%; background: var(--green); }
.chipbtn { background: transparent; border: 1px solid var(--line-2); color: var(--ink-muted); border-radius: 9999px; padding: 6px 11px; font: 500 12.5px var(--sans); cursor: pointer; }
.chipbtn:hover { color: var(--ink); border-color: var(--green); }
.chipbtn:focus-visible { outline: 2px solid var(--green-hi); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: start; }
.mapbox { position: relative; background: radial-gradient(circle at 50% 50%, #111e27 0%, var(--sky) 72%); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; height: min(78vh, 860px); min-height: 420px; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.drag { cursor: grabbing; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); font: 600 18px var(--sans); cursor: pointer; }
.hint { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--ink-faint); background: rgba(10,16,21,.7); padding: 4px 8px; border-radius: 6px; }
.zoom button { display: grid; place-items: center; padding: 0; }
.zoom button:hover { border-color: var(--green); }
.zoom button:focus-visible, canvas:focus-visible, .mini:focus-visible { outline: 2px solid var(--green-hi); outline-offset: 2px; }
.zoom button svg { width: 18px; height: 18px; }
.zlvl { font: 600 11px/1 var(--mono); color: var(--ink-muted); text-align: center; padding: 4px 0 0; }
.mini { position: absolute; right: 60px; bottom: 12px; width: 150px; height: 150px; border: 1px solid var(--line-2); border-radius: 10px; background: rgba(10,16,21,.85); cursor: crosshair; touch-action: none; }
.mini[hidden] { display: none; }
.mapbox.full { position: fixed; inset: 0; z-index: 1000; width: 100vw; height: 100vh; height: 100dvh; min-height: 0; border: 0; border-radius: 0; }
.mapbox:fullscreen { width: 100vw; height: 100vh; min-height: 0; border: 0; border-radius: 0; }
.mapbox.isfull .hint { display: none; }
#zinfo { display: none; font: italic 600 17px/1 var(--display); }
.mapbox.isfull #zinfo { display: grid; }
.mapbox.nodetail .fsdetail { display: none; }
.mapbox .fsdetail { position: absolute; left: 12px; top: 12px; z-index: 2; width: min(360px, calc(100% - 84px)); max-height: calc(100% - 24px); overflow: auto; background: rgba(18,28,35,.95); box-shadow: 0 8px 28px rgba(0,0,0,.4); }
body.noscroll { overflow: hidden; }
@media (max-width: 600px) { .mini { width: 104px; height: 104px; } .hint { display: none; } .mapbox .fsdetail { top: auto; bottom: 12px; width: calc(100% - 84px); max-height: 34%; } }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h2 { margin: 0; font: 600 17px/1.35 var(--sans); text-wrap: balance; }
.card p { margin: 0; font-size: 14px; color: var(--ink-muted); }
.path { font: 500 12px/1.4 var(--mono); color: var(--ink-faint); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12px/1 var(--sans); padding: 5px 8px; border-radius: 9999px; border: 1px solid var(--line-2); color: var(--ink-muted); }
.chip.lit { border-color: var(--green); color: var(--green-hi); }
.chip.hall { background: var(--green-deep); border-color: var(--green-hi); color: var(--ink); }
.chip.role { border-color: var(--role); color: var(--role); }
.legend { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-muted); }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend svg { width: 16px; height: 16px; flex: none; }
.src { font-size: 12px; color: var(--ink-faint); }
.src a { color: var(--ink-muted); }
@media (max-width: 980px) { .main { grid-template-columns: minmax(0, 1fr); } .mapbox { height: 68vh; } }
</style>
